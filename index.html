<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-background">
            <img class="greenleaf-bg" src="material/photo-1585202900225-6d3ac20a6962.avif" alt="green plant image">
            <div class="odin-text"> <img class="logo" src="material/odin-lined.png" alt="odin logo"> Odin</div>
            <footer>Photo by <a href="https://unsplash.com/photos/25xggax4bSA">Halle West</a> on <a href="https://unsplash.com">Unplash</a></footer>
        </div>
        
        <form action="">
            <div class="top-heading">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. sign up <em>now</em> to get started</p>
                <p>You <em>know</em> you want to.</p>
            </div>

            <fieldset class="form-details">
                <h2>Lets do this!</h2>
                <div>
                    <div class="form-row">
                        <label for="fname">FIRST NAME</label>
                        <input type="text" name="fname" id="fname">
                    </div>

                    <div class="form-row">
                        <label for="lname">LAST NAME</label>
                        <input type="text" name="lname" id="lname">
                    </div>
                </div>
                
                <div>
                    <div class="form-row">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email" placeholder="sample@gmail.com">
                    </div>
                
                    <div class="form-row">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" name="phone" id="phone" maxlength="10">
                    </div>
                </div>
                
                <div>
                    <div class="form-row">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password" minlength="6" maxlength="12">
                        <span class="pass-msg">password length (6-12 characters)</span>
                    </div>

                    <div class="form-row">
                        <label for="password">CONFIRM PASSWORD</label>
                        <input type="password" name="password" id="password">
                    </div>
                </div>
                
            </fieldset>

        </form>
    </div>
</body>
</html>
